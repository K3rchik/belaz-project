<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БелАЗ: Мониторинг Ресурса</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        /* ... (все ваши стили остаются без изменений) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #dde0e3; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .heading { background-color: #1E1E1E; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 80px; }
        .heading h1 { color: #dde0e3; font-size: 20px; }
        .xray-button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .xray-button.active { background-color: #f44336; box-shadow: 0 0 15px #f44336; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .model-container { flex: 2; background-color: #2a2a2a; }
        model-viewer { width: 100%; height: 100%; background-color: #2a2a2a; }
        .dashboard-panel { flex: 0.9; background-color: #A8A8A8; padding: 20px; overflow-y: auto; border-left: 1px solid #1E1E1E; }
        .metric-card { background: #dde0e3; border: 1px solid #1E1E1E; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .metric-title { font-size: 0.9rem; color: #1E1E1E; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-size: 1.8rem; font-weight: bold; color: #1E1E1E; }
        .metric-sub { font-size: 0.85rem; color: #1E1E1E; margin-top: 5px; }
        .health-bar-container { height: 10px; background-color: #ccc; border-radius: 5px; margin-top: 10px; overflow: hidden; border: 1px solid #999; }
        .health-bar { height: 100%; width: 100%; background-color: #4CAF50; transition: width 0.5s; }
        
        /* Стили для колес */
        .wheel-status { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .wheel-status-item { text-align: center; padding: 8px; border-radius: 4px; font-weight: bold; border: 1px solid #999; }
        .wheel-status-item.normal { background: rgba(76, 175, 80, 0.2); color: #2e7d32; }
        .wheel-status-item.warning { background: rgba(255, 193, 7, 0.2); color: #ff6f00; }
        .wheel-status-item.alarm { background: rgba(244, 67, 54, 0.2); color: #c62828; }
        .sensor-data { font-size: 11px; margin-top: 4px; color: #555; }
        .status-text { text-align: center; color: #1E1E1E; font-size: 0.8rem; margin-top: 20px; }
        .flex-between { display: flex; justify-content: space-between; }
        .xray-indicator { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); color: #ffaa00; padding: 10px 20px; border-radius: 30px; font-weight: bold; z-index: 100; display: none; }
        .xray-indicator.active { display: block; }
    </style>
</head>
<body>
    <div class="heading">
        <h1>БЕЛАЗ: МОНИТОРИНГ ОСТАТОЧНОГО РЕСУРСА</h1>
        <button class="xray-button" id="xrayBtn">🔍 РЕНТГЕН</button>
    </div>
<div class="xray-indicator" id="xrayIndicator">🔍 РЕЖИМ РЕНТГЕНА</div>

<div class="main-container">
    <div class="model-container">
        <model-viewer
            id="belaz-model"
            src="Belaz75131.glb"
            alt="БелАЗ 75131"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            camera-orbit="-45deg 55deg 25m">
        </model-viewer>
    </div>

    <div class="dashboard-panel">
        <!-- Основные параметры -->
        <div class="metric-card">
            <div class="metric-title">ПАРАМЕТРЫ</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><span class="metric-value" id="speed">0</span><div class="metric-sub">км/ч</div></div>
                <div><span class="metric-value" id="payload">0</span><div class="metric-sub">т</div></div>
                <div><span class="metric-value" id="fuel-level">0</span><div class="metric-sub">л</div></div>
                <div><span class="metric-value" id="incline">0</span><div class="metric-sub">%</div></div>
            </div>
        </div>
        
        <!-- Двигатель -->
        <div class="metric-card">
            <div class="metric-title">ДВИГАТЕЛЬ</div>
            <div class="metric-value" id="engine-health">100%</div>
            <div class="health-bar-container">
                <div class="health-bar" id="engine-bar"></div>
            </div>
            <div class="metric-sub" id="engine-status">Загрузка...</div>
        </div>

        <!-- Рама -->
        <div class="metric-card">
            <div class="metric-title">РАМА</div>
            <div class="metric-value" id="frame-health">100%</div>
            <div class="health-bar-container">
                <div class="health-bar" id="frame-bar"></div>
            </div>
            <div class="metric-sub" id="frame-status">Загрузка...</div>
        </div>

        <!-- Шины -->
        <div class="metric-card">
            <div class="metric-title">РЕСУРС ШИН (33.00R51)</div>
            <div class="wheel-status" style="grid-template-columns: 1fr 1fr;">
                <!-- ПЕРЕДНЯЯ ОСЬ -->
                <div class="wheel-status-item" id="Tire_FL-status">
                    <span>ЛЕВОЕ ПЕРЕД. (FL)</span>
                    <div class="health-bar-container" style="height: 6px;"><div class="health-bar" id="Tire_FL-bar"></div></div>
                    <div class="sensor-data" id="Tire_FL-data">0 | 0°C</div>
                </div>
                <div class="wheel-status-item" id="Tire_FR-status">
                    <span>ПРАВОЕ ПЕРЕД. (FR)</span>
                    <div class="health-bar-container" style="height: 6px;"><div class="health-bar" id="Tire_FR-bar"></div></div>
                    <div class="sensor-data" id="Tire_FR-data">0 | 0°C</div>
                </div>
            </div>
            <div class="wheel-status" style="grid-template-columns: 1fr 1fr 1fr 1fr; margin-top: 10px; gap: 5px;">
                <!-- ЗАДНЯЯ ОСЬ -->
                <div class="wheel-status-item" id="Tire_RLO-status" style="padding: 4px; font-size: 10px;">
                    <span>RLO</span>
                    <div class="health-bar-container" style="height: 4px;"><div class="health-bar" id="Tire_RLO-bar"></div></div>
                    <div class="sensor-data" id="Tire_RLO-data">0|0</div>
                </div>
                <div class="wheel-status-item" id="Tire_RLI-status" style="padding: 4px; font-size: 10px;">
                    <span>RLI</span>
                    <div class="health-bar-container" style="height: 4px;"><div class="health-bar" id="Tire_RLI-bar"></div></div>
                    <div class="sensor-data" id="Tire_RLI-data">0|0</div>
                </div>
                <div class="wheel-status-item" id="Tire_RRI-status" style="padding: 4px; font-size: 10px;">
                    <span>RRI</span>
                    <div class="health-bar-container" style="height: 4px;"><div class="health-bar" id="Tire_RRI-bar"></div></div>
                    <div class="sensor-data" id="Tire_RRI-data">0|0</div>
                </div>
                <div class="wheel-status-item" id="Tire_RRO-status" style="padding: 4px; font-size: 10px;">
                    <span>RRO</span>
                    <div class="health-bar-container" style="height: 4px;"><div class="health-bar" id="Tire_RRO-bar"></div></div>
                    <div class="sensor-data" id="Tire_RRO-data">0|0</div>
                </div>
            </div>
        </div>

        <div class="status-text" id="connection-status">Подключение...</div>
    </div>
</div>

<script type="module">
    const model = document.getElementById('belaz-model');
    const xrayBtn = document.getElementById('xrayBtn');
    const xrayIndicator = document.getElementById('xrayIndicator');
    
    // Маппинг: какое колесо из БД какому материалу в 3D соответствует
    const wheelToMesh = {
        'Tire_FL': 'w1', 'Tire_FR': 'w2',
        'Tire_RLI': 'w3', 'Tire_RLO': 'w3', // Внутреннее и внешнее красим вместе
        'Tire_RRI': 'w4', 'Tire_RRO': 'w4'
    };

    const mats = { frame: null, engine: null, w1: null, w2: null, w3: null, w4: null };
    const orig = new Map();
    let xray = false;

    const get = id => document.getElementById(id);

    function findMaterials() {
        if (!model.model?.materials) return;
        model.model.materials.forEach(m => {
            const name = m.name;
            if (m.pbrMetallicRoughness) orig.set(m, [...m.pbrMetallicRoughness.baseColorFactor]);
            if (m.name === 'Материал') mats.frame = m;
            else if (m.name === 'Материал.001') mats.w1 = m;
            else if (m.name === 'Материал.002') mats.w2 = m;
            else if (m.name === 'Материал.003') mats.w3 = m;
            else if (m.name === 'Материал.004') mats.w4 = m;
            else if (m.name === 'Материал.005') mats.engine = m;
        });
    }

    function updateBar(id, val) {
        const el = get(id);
        if (!el) return;
        el.style.width = val + '%';
        if (val > 80) el.style.backgroundColor = "#4CAF50";
        else if (val > 40) el.style.backgroundColor = "#FFC107";
        else el.style.backgroundColor = "#F44336";
    }

    function getStatusText(h) {
        if (h > 80) return 'Отличное';
        if (h > 50) return 'Норма';
        return 'Требует ТО';
    }

    async function updateDashboard() {
        try {
            const response = await fetch('/api/data');
            if (!response.ok) throw new Error("DB Error");
            const data = await response.json();

            // 1. Телеметрия
            get('speed').innerText = Math.round(data.telemetry.speed || 0);
            get('payload').innerText = (data.telemetry.payload > 500 ? data.telemetry.payload/1000 : data.telemetry.payload || 0).toFixed(0);
            get('fuel-level').innerText = Math.round(data.telemetry.fuel_level || 0);
            get('incline').innerText = (data.telemetry.incline || 0).toFixed(1);

            // 2. Двигатель
            if (data.health.Engine) {
                const eh = data.health.Engine.health_index;
                get('engine-health').innerText = eh.toFixed(1) + '%';
                updateBar('engine-bar', eh);
                get('engine-status').innerText = getStatusText(eh);
                if (!xray && mats.engine) highlight(mats.engine, eh);
            }

            // 3. Рама
            if (data.health.Frame) {
                const fh = data.health.Frame.health_index;
                get('frame-health').innerText = fh.toFixed(1) + '%';
                updateBar('frame-bar', fh);
                get('frame-status').innerText = getStatusText(fh);
                if (!xray && mats.frame) highlight(mats.frame, fh);
            }

            // 4. Шины (6 колес)
            const wheelKeys = ['Tire_FL', 'Tire_FR', 'Tire_RLI', 'Tire_RLO', 'Tire_RRI', 'Tire_RRO'];
            wheelKeys.forEach(key => {
                if (data.health[key]) {
                    const h = data.health[key].health_index;
                    updateBar(`${key}-bar`, h);
                    
                    const suffix = key.replace('Tire_', '').toLowerCase();
                    const p = (data.telemetry[`tire_press_${suffix}`] || 700000) / 100000;
                    const t = data.telemetry[`tire_temp_${suffix}`] || 40;
                    
                    get(`${key}-data`).innerText = `${p.toFixed(1)} bar | ${Math.round(t)}°C`;
                    
                    const item = get(`${key}-status`);
                    if (t > 110) item.className = 'wheel-status-item alarm';
                    else if (t > 90) item.className = 'wheel-status-item warning';
                    else item.className = 'wheel-status-item normal';

                    // Покраска колеса в 3D
                    const meshName = wheelToMesh[key];
                    if (!xray && mats[meshName]) {
                        highlight(mats[meshName], h, (t > 110 ? [1,0,0] : null));
                    }
                }
            });

            get('connection-status').innerText = 'Обновлено: ' + new Date().toLocaleTimeString();
            get('connection-status').style.color = "#1E1E1E";

        } catch (err) {
            console.error(err);
            get('connection-status').innerText = 'Ошибка связи с БД';
            get('connection-status').style.color = "red";
        }
    }

    function highlight(m, health, overrideColor = null) {
        if (!m?.pbrMetallicRoughness) return;
        let col = overrideColor;
        if (!col) {
            if (health > 80) col = [0.3, 0.8, 0.3];
            else if (health > 40) col = [0.9, 0.7, 0.1];
            else col = [0.9, 0.2, 0.2];
        }
        m.pbrMetallicRoughness.setBaseColorFactor([...col, 1]);
    }

    function toggleXray() {
        xray = !xray;
        xrayBtn.classList.toggle('active', xray);
        xrayIndicator.classList.toggle('active', xray);
        if (xray) {
            Object.values(mats).forEach(m => {
                if (m) { m.setAlphaMode("BLEND"); m.pbrMetallicRoughness.setBaseColorFactor([0.5, 0.5, 0.5, 0.2]); }
            });
        } else {
            if (model.model) {
                model.model.materials.forEach(m => m.setAlphaMode("OPAQUE"));
            }
            updateDashboard();
        }
    }

    model.addEventListener('load', () => {
        findMaterials();
        setInterval(updateDashboard, 2000);
    });

    xrayBtn.addEventListener('click', toggleXray);
</script>
</body>
</html>
